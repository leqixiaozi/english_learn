<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><ns0:rect width="1280" height="900" fill="white" /><ns0:text x="26" y="18" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#222222">G · 表达创作：自己的稿件与版本</ns0:text><ns0:rect x="24" y="80" width="1232" height="744" rx="4" fill="white" stroke="#777777" /><ns0:rect x="24" y="80" width="166" height="744" rx="4" fill="#f5f5f5" stroke="#b9b9b9" /><ns0:text x="44" y="104" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#222222">Relay</ns0:text><ns0:text x="45" y="170" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#222222">Home</ns0:text><ns0:text x="45" y="228" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#222222">Courses</ns0:text><ns0:text x="45" y="286" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#222222">Series</ns0:text><ns0:text x="45" y="344" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#222222">Practice</ns0:text><ns0:rect x="35" y="397" width="143" height="43" rx="4" fill="#e4e4e4" stroke="#e4e4e4" /><ns0:text x="45" y="402" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#222222">Studio</ns0:text><ns0:text x="45" y="776" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#666666">Settings</ns0:text><ns0:text x="214" y="103" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#555555">English   |   Bilingual: Off</ns0:text><ns0:text x="214" y="160" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#222222">AI and software development</ns0:text><ns0:rect x="214" y="759" width="1016" height="44" rx="4" fill="#fafafa" stroke="#b9b9b9" /><ns0:text x="231" y="770" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#222222">&gt; Materials &amp; support</ns0:text><ns0:text x="26" y="853" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#555555">文档注释：主体只放当前内容和操作；底部资料默认折叠。图中文字、进度和状态为示例。</ns0:text><ns0:rect x="214" y="215" width="144" height="36" rx="4" fill="#333333" stroke="#333333" /><ns0:text x="226" y="222" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="white">Draft</ns0:text><ns0:rect x="374" y="215" width="144" height="36" rx="4" fill="#f7f7f7" stroke="#b9b9b9" /><ns0:text x="386" y="222" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#333333">Saved</ns0:text><ns0:rect x="1046" y="215" width="184" height="36" rx="4" fill="#f7f7f7" stroke="#b9b9b9" /><ns0:text x="1058" y="222" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#333333">Version 02</ns0:text><ns0:rect x="214" y="282" width="1016" height="337" rx="4" fill="white" stroke="#b9b9b9" /><ns0:text x="238" y="307" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#222222">AI helps developers work faster.</ns0:text><ns0:text x="238" y="338" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#222222" /><ns0:text x="238" y="369" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#222222">But we still need to understand the code.</ns0:text><ns0:text x="238" y="400" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#222222" /><ns0:text x="238" y="431" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#222222">When something goes wrong, we need to know</ns0:text><ns0:text x="238" y="462" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#222222">how to investigate it.</ns0:text><ns0:rect x="214" y="650" width="164" height="36" rx="4" fill="#333333" stroke="#333333" /><ns0:text x="226" y="657" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="white">Save draft</ns0:text><ns0:rect x="394" y="650" width="180" height="36" rx="4" fill="#f7f7f7" stroke="#b9b9b9" /><ns0:text x="406" y="657" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#333333">Keep version</ns0:text><ns0:rect x="590" y="650" width="164" height="36" rx="4" fill="#f7f7f7" stroke="#b9b9b9" /><ns0:text x="602" y="657" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#333333">Record</ns0:text></ns0:svg>